<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Osama El Bostany - Link in Bio</title>
<!-- استدعاء Tailwind CSS للتصميم -->
<script src="https://cdn.tailwindcss.com"></script>
<!-- استدعاء FontAwesome للأيقونات -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<!-- خط القاهرة عشان الكلام العربي والانجليزي يكون شكله شيك -->
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap');
body {
font-family: 'Cairo', sans-serif;
background-color: #000000;
color: #ffffff;
}
.link-card {
transition: transform 0.2s, background-color 0.2s;
}
.link-card:hover {
transform: scale(1.02);
background-color: #1a1a1a;
}
</style>
</head>
<body class="min-h-screen flex flex-col items-center py-12 px-4">
​<!-- قسم الصورة والاسم -->
<div class="mb-10 text-center">
<!-- حط لينك صورتك الحقيقي مكان الرابط اللي بين علامتين التنصيص هنا -->
<img src="https://i.ibb.co/30z3Tqh/profile.jpg" alt="Osama El Bostany" class="w-28 h-28 rounded-[2rem] mx-auto object-cover border-4 border-gray-700 mb-4 shadow-lg">
<h1 class="text-3xl font-bold mb-2">Osama El Bostany</h1>
<p class="text-gray-400 text-md">تابعني على حساباتي</p>
</div>
​<!-- قسم الزراير واللينكات -->
<div class="w-full max-w-md space-y-4 text-left" dir="ltr">
​<!-- Facebook -->
<!-- شيل كلمة (حط_لينك_الفيس_هنا) وحط اللينك بتاعك -->
<a href="حط_لينك_الفيس_هنا" class="link-card flex items-center justify-between p-4 rounded-2xl bg-[#111111] border border-gray-800 text-white no-underline">
<i class="fa-brands fa-facebook text-2xl w-8"></i>
<span class="font-semibold text-lg flex-grow text-center">Facebook</span>
<i class="fa-solid fa-chevron-left text-gray-600 text-sm w-8 text-right"></i>
</a>
​<!-- Instagram -->
<a href="حط_لينك_الانستا_هنا" class="link-card flex items-center justify-between p-4 rounded-2xl bg-[#111111] border border-gray-800 text-white no-underline">
<i class="fa-brands fa-instagram text-2xl w-8"></i>
<span class="font-semibold text-lg flex-grow text-center">Instagram</span>
<i class="fa-solid fa-chevron-left text-gray-600 text-sm w-8 text-right"></i>
</a>
​<!-- X (Twitter) -->
<a href="حط_لينك_اكس_هنا" class="link-card flex items-center justify-between p-4 rounded-2xl bg-[#111111] border border-gray-800 text-white no-underline">
<i class="fa-brands fa-x-twitter text-2xl w-8"></i>
<span class="font-semibold text-lg flex-grow text-center">X</span>
<i class="fa-solid fa-chevron-left text-gray-600 text-sm w-8 text-right"></i>
</a>
​<!-- TikTok -->
<a href="حط_لينك_التيك_توك_هنا" class="link-card flex items-center justify-between p-4 rounded-2xl bg-[#111111] border border-gray-800 text-white no-underline">
<i class="fa-brands fa-tiktok text-2xl w-8"></i>
<span class="font-semibold text-lg flex-grow text-center">TikTok</span>
<i class="fa-solid fa-chevron-left text-gray-600 text-sm w-8 text-right"></i>
</a>
​<!-- Snapchat -->
<a href="حط_لينك_سناب_هنا" class="link-card flex items-center justify-between p-4 rounded-2xl bg-[#111111] border border-gray-800 text-white no-underline">
<i class="fa-brands fa-snapchat text-2xl w-8"></i>
<span class="font-semibold text-lg flex-grow text-center">Snapchat</span>
<i class="fa-solid fa-chevron-left text-gray-600 text-sm w-8 text-right"></i>
</a>
​<!-- LinkedIn -->
<a href="حط_لينك_لينكد_ان_هنا" class="link-card flex items-center justify-between p-4 rounded-2xl bg-[#111111] border border-gray-800 text-white no-underline">
<i class="fa-brands fa-linkedin text-2xl w-8"></i>
<span class="font-semibold text-lg flex-grow text-center">LinkedIn</span>
<i class="fa-solid fa-chevron-left text-gray-600 text-sm w-8 text-right"></i>
</a>
​</div>
​</body>
</html>
